notes: >-
  nTop Core is nTop's first-party developer library for working with implicit
  bodies exported from nTop (.implicit files). It ships as a native C library
  with first-party bindings/examples for C++, .NET, and Python. It is
  vendor-distributed with the nTop product / provided to customers rather than
  published to a public package registry, so no npm / PyPI / NuGet / Maven /
  crates.io listing exists (PyPI ntop / ntopcore / ntop-core all 404; NuGet
  query returns no first-party package as of this probe).
