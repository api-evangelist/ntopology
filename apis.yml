aid: ntopology
name: Ntopology
description: >-
  nTop (formerly nTopology) is a computational design software platform for
  engineering teams building complex, high-performance products. Its parametric,
  field-driven modeling engine combines geometry, simulation data, and
  manufacturing constraints so engineers can move from requirements to
  production-ready designs in a fraction of the traditional time. nTop is used
  across aerospace and defense, automotive, medical, and industrial energy
  sectors for lightweighting, lattice and implicit modeling, thermal and
  structural optimization, and additive manufacturing. nTop also ships nTop
  Core, a first-party developer library (C++, .NET, and Python) for working with
  implicit bodies exported from nTop. The company is headquartered in New York
  City and is backed by venture investors including Canaan Partners and DCVC.
